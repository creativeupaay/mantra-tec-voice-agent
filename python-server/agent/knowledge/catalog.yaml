# ─────────────────────────────────────────────────────────────────────────────
# Mantra Tech product catalog — single source of truth for product facts.
#
# The voice agent reads this file through the `search_products` tool. Nothing in
# here is placed in the system prompt, so adding or changing a product does NOT
# make the prompt longer. Edit this file (not prompts.py) whenever the client
# sends a product update: status, price, availability, Aadhaar / non-Aadhaar,
# what to recommend instead, bulk exceptions.
#
# The file is re-read automatically when it changes (mtime check), but a Docker
# deployment still needs a rebuild/restart to ship the new file.
#
# Fields (all optional except id + name):
#   codes      How callers say the model name. Matched ignoring case, spaces, dashes.
#   type       Short device description.
#   aadhaar    true = Aadhaar/UIDAI certified, false = Non-Aadhaar, omit if unknown.
#   status     active | support_ended | discontinued.  Omit if not confirmed by client.
#   summary    One line on what it is.
#   use_when   When it is the right recommendation.
#   tags       Words used to match need-based queries ("non aadhaar fingerprint").
#   sales      website | sales_team   (see sales_routes below). Omit when notes decide.
#   price      Exactly what the agent may say about price. Omit = sales team quotes.
#   availability  Anything specific about stock / listing / delivery.
#   recommend  false = never suggest this device unless the caller names it.
#   notes      Extra client rules for this device, one short line each.
#   updated / source   When and from where the facts came (for audits).
# ─────────────────────────────────────────────────────────────────────────────

website: "servico.mantratec.com"
website_spoken: "servico dot mantratec dot com, in the Shop section"

sales_routes:
  website: >-
    Single or a few units: order on the website ({website}), no callback needed.
    Bulk: offer a sales team callback.
  sales_team: >-
    Sales team only, any quantity: offer a sales team callback and collect details.

status_text:
  active: "Active and fully supported. Never say it is discontinued."
  support_ended: "Support has ended for this model. Do not suggest it for new purchases."
  discontinued: "Discontinued."
  unconfirmed: "In the catalog. Not discontinued as far as we know; the sales team confirms stock."

# Returned when the caller asks for something that is not in this file.
not_found: >-
  Not in the catalog. Do not guess its specs, price or status. Tell the caller the
  sales team will guide them on this device, collect their details and arrange a
  sales team callback.

