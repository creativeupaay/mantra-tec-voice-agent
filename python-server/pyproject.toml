[project]
name = "mantra-tech-voice-agent"
version = "0.1.0"
description = "Mantra Tech AI Voice Agent — Pipecat + LangGraph + MongoDB"
requires-python = ">=3.10"
dependencies = [
    # ── Voice pipeline ────────────────────────────────────────────────────────
    "pipecat-ai[deepgram,elevenlabs,openrouter,runner,silero,webrtc,websocket]",
    "pipecat-ai-whisker",
    "pipecat-ai-tail",
    # ── Database ──────────────────────────────────────────────────────────────
    "motor>=3.6.0",          # async MongoDB driver
    "pymongo>=4.9.0",        # ObjectId, ReturnDocument, etc.
    # ── Cache ─────────────────────────────────────────────────────────────────
    "redis[asyncio]>=5.0.0",
    # ── HTTP (Zoho API calls) ─────────────────────────────────────────────────
    "httpx>=0.27.0",
    # ── Env / config ──────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "instructor>=1.15.1",
    "openai>=2.41.1",
    "google-genai>=1.33.0",
    "qdrant-client>=1.18.0",
    "langchain-text-splitters>=1.1.2",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
